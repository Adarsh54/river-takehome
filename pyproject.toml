[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-benchmark"
version = "0.1.0"
description = "Evidence-first SEC competitor benchmarking"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "jsonschema>=4.23,<5", "python-dotenv>=1,<2", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "reportlab>=4.2,<5", "pypdf>=5,<7"]

[project.optional-dependencies]
ocr = ["pypdfium2>=4.30,<6", "Pillow>=10,<13"]
dev = ["pytest>=8,<10"]

[project.scripts]
apex-benchmark = "apex_benchmark.cli:main"
apex-workspace = "apex_benchmark.workspace:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
apex_benchmark = ["workspace.html"]
